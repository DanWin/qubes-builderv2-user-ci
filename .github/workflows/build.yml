name: Qubes Builder v2 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-qubes:
    name: Build Qubes OS
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Initial Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ca-certificates docker.io docker-cli git gpg

      - name: Execute Qubes Builder v2 Pipeline
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qubes-build-artifacts
          path: artifacts/
          retention-days: 14
